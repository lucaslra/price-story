components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        password_hash:
          type: string
    UserCreate:
      type: object
      required: [email, password_hash]
      properties:
        email:
          type: string
          format: email
        password_hash:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_name:
          type: string
        product_url:
          type: string
          format: uri
        created_by_user:
          $ref: "#/components/schemas/User"
        updated_by_user:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        created_datetime:
          type: string
          format: date-time
        updated_datetime:
          type: string
          format: date-time
    ProductCreate:
      type: object
      required: [product_name, product_url]
      properties:
        product_name:
          type: string
        product_url:
          type: string
          format: uri
    PriceStory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/Product"
        created_by_user:
          $ref: "#/components/schemas/User"
        updated_by_user:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        created_datetime:
          type: string
          format: date-time
        updated_datetime:
          type: string
          format: date-time
    PriceStoryCreate:
      type: object
      required: [product_id]
      properties:
        product_id:
          type: string
          format: uuid
    PricePoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        price:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        product:
          $ref: "#/components/schemas/Product"
        created_by_user:
          $ref: "#/components/schemas/User"
        updated_by_user:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        created_datetime:
          type: string
          format: date-time
        updated_datetime:
          type: string
          format: date-time
    PricePointCreate:
      type: object
      required: [price, timestamp, product_id]
      properties:
        price:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        product_id:
          type: string
          format: uuid
    UserUpdate:
      type: object
      required: [email, password_hash]
      properties:
        email:
          type: string
          format: email
        password_hash:
          type: string
    ProductUpdate:
      type: object
      required: [product_name, product_url]
      properties:
        product_name:
          type: string
        product_url:
          type: string
          format: uri
    PriceStoryUpdate:
      type: object
      required: [product_id]
      properties:
        product_id:
          type: string
          format: uuid
    PricePointUpdate:
      type: object
      required: [price, timestamp, product_id]
      properties:
        price:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        product_id:
          type: string
          format: uuid
