openapi: 3.1.0
info:
  title: Price Story API
  version: 1.0.0
  description: API for tracking products, price points, and price stories.
servers:
  - url: http://localhost:8080
    description: Local server
tags:
  - name: Health
    description: System health and status
  - name: Users
    description: Operations on users
  - name: Products
    description: Operations on products
  - name: PriceStories
    description: Operations on price stories
  - name: PricePoints
    description: Operations on price points
paths:
  /api/health:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check
      description: Returns the health status of the API.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      description: Retrieves all users.
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [Users]
      summary: Create user
      description: Creates a new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/users/{id}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Get user
      description: Retrieves a single user by ID.
      parameters:
        - in: path
          name: id
          required: true
          description: User ID (UUID)
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    put:
      operationId: updateUser
      tags: [Users]
      summary: Update user
      description: Updates an existing user by ID.
      parameters:
        - in: path
          name: id
          required: true
          description: User ID (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete user
      description: Deletes a user by ID.
      parameters:
        - in: path
          name: id
          required: true
          description: User ID (UUID)
          schema:
            type: string
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/products:
    get:
      operationId: listProducts
      tags: [Products]
      summary: List products
      description: Retrieves all products.
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [Products]
      summary: Create product
      description: Creates a new product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
